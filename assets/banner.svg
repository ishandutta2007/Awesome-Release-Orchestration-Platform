<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c17"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Pipeline Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashAnim 6s linear infinite;
    }
    .flow-line-fast {
      stroke-dasharray: 6 10;
      animation: dashAnim 3s linear infinite;
    }
    .pulse-glow {
      animation: pulseAnim 3s ease-in-out infinite alternate;
    }
    @keyframes dashAnim {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseAnim {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Tech Grid Lines -->
  <g stroke="#334155" stroke-width="0.6" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Ambient Glowing Blobs -->
  <circle cx="180" cy="180" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="180" r="130" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="60" r="150" fill="#ec4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Circuit Pipeline Paths -->
  <g fill="none" stroke-linecap="round">
    <!-- Top Pipeline -->
    <path d="M 60,60 L 260,60 L 320,110 L 880,110 L 940,60 L 1140,60" stroke="#1e293b" stroke-width="2"/>
    <path d="M 60,60 L 260,60 L 320,110 L 880,110 L 940,60 L 1140,60" stroke="url(#accentGrad)" stroke-width="2" class="flow-line" filter="url(#softGlow)"/>

    <!-- Bottom Pipeline -->
    <path d="M 80,300 L 320,300 L 400,250 L 800,250 L 880,300 L 1120,300" stroke="#1e293b" stroke-width="2"/>
    <path d="M 80,300 L 320,300 L 400,250 L 800,250 L 880,300 L 1120,300" stroke="#38bdf8" stroke-width="2" class="flow-line-fast" opacity="0.7" filter="url(#softGlow)"/>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(80, 0)">
    <!-- Awesome Ecosystem Tag -->
    <g transform="translate(0, 48)">
      <rect width="230" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#10b981" class="pulse-glow"/>
      <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" letter-spacing="0.8">AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Heading -->
    <text x="0" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
      Release Orchestration
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f8fafc">
      Continuous Delivery, Progressive Rollouts &amp; GitOps
    </text>

    <!-- Description -->
    <text x="0" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400" fill="#94a3b8">
      Curated directory of enterprise SaaS platforms, GitOps engines &amp; open-source release tooling
    </text>

    <!-- Capability Badges Row -->
    <g transform="translate(0, 235)">
      <!-- Badge 1: GitOps CD -->
      <g transform="translate(0, 0)">
        <rect width="120" height="32" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
        <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">GitOps CD</text>
      </g>

      <!-- Badge 2: Multi-Cloud -->
      <g transform="translate(132, 0)">
        <rect width="130" height="32" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#818cf8"/>
        <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">Multi-Cloud</text>
      </g>

      <!-- Badge 3: Governance -->
      <g transform="translate(274, 0)">
        <rect width="135" height="32" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#f472b6"/>
        <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f472b6">Governance</text>
      </g>

      <!-- Badge 4: Progressive Rollout -->
      <g transform="translate(421, 0)">
        <rect width="145" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="4" fill="#34d399"/>
        <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">Canary Rollout</text>
      </g>
    </g>
  </g>

  <!-- RIGHT DIAGRAM / ORCHESTRATION ORBIT -->
  <g transform="translate(1000, 180)">
    <!-- Static Orbit Rings -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.8"/>

    <!-- Center Control Hub -->
    <circle cx="0" cy="0" r="40" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <g fill="none" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-14, -14)">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </g>

    <!-- Animated Rotating Outer Nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <!-- Node 1 (Top) -->
      <g transform="translate(0, -110)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
      </g>
      <!-- Node 2 (Right) -->
      <g transform="translate(110, 0)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="5" fill="#818cf8"/>
      </g>
      <!-- Node 3 (Bottom) -->
      <g transform="translate(0, 110)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#ec4899" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="5" fill="#ec4899"/>
      </g>
      <!-- Node 4 (Left) -->
      <g transform="translate(-110, 0)">
        <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="5" fill="#10b981"/>
      </g>
    </g>
  </g>
</svg>
